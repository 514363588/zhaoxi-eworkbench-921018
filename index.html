<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="昭熹工作台">
<meta name="theme-color" content="#f48aa6">
<meta name="mobile-web-app-capable" content="yes"><link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="shortcut icon" type="image/png" href="icon-180.png">
<title>昭熹的工作台</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif; background: #fce4ec; color: #5a3d4f; }
body { position: relative; }
:root {
  --pink-bg: #fde8ee;
  --pink-soft: #fdd9e3;
  --pink-mid: #f8b8c9;
  --pink-deep: #f48aa6;
  --pink-button: #f5a3b8;
  --pink-button-deep: #ee8aa3;
  --text-dark: #4a3340;
  --text-mid: #7a5d6a;
  --text-light: #b89aa6;
  --white: #ffffff;
  --card-shadow: 0 6px 18px rgba(244, 138, 166, 0.15);
  --green: #6ec9a3;
  --blue: #6db9e8;
  --yellow: #f5d77a;
  --red: #ef9a9a;
}
#app { width: 100vw; height: 100vh; max-width: 514px; margin: 0 auto; background: var(--pink-bg); position: relative; overflow: hidden; box-shadow: 0 0 30px rgba(0,0,0,0.08); }
.bg-deco { position: absolute; inset: 0; pointer-events: none; z-index: 0; background: radial-gradient(circle at 20% 10%, #fff5f8 0%, transparent 40%), radial-gradient(circle at 80% 80%, #fff0f5 0%, transparent 50%); }

/* =============== 侧边栏 =============== */
.sidebar { position: absolute; top: 0; left: 0; width: 84px; height: 100%; background: linear-gradient(180deg, #fce4ec 0%, #f8d2dd 100%); z-index: 100; padding-top: 50px; display: flex; flex-direction: column; align-items: center; gap: 6px; border-right: 1px solid rgba(244,138,166,0.12); overflow-y: auto; overflow-x: hidden; }
.sidebar::-webkit-scrollbar { display: none; }
.side-item { width: 72px; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; padding: 4px 0; border-radius: 12px; transition: all 0.2s; flex-shrink: 0; }
.side-item.active { background: rgba(255,255,255,0.6); box-shadow: 0 2px 8px rgba(244,138,166,0.25); }
.side-icon { width: 56px; height: 60px; position: relative; flex-shrink: 0; }
/* 头（白脸） */
.hk-head { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 44px; height: 40px; background: #ffffff; border-radius: 50% 50% 48% 48%; border: 1.5px solid #3d2a2f; box-sizing: border-box; }
/* 左耳 */
.hk-ear-l, .hk-ear-r { position: absolute; top: 0; width: 14px; height: 14px; background: #ffffff; border: 1.5px solid #3d2a2f; border-radius: 50%; z-index: 1; }
.hk-ear-l { left: 7px; }
.hk-ear-r { right: 7px; }
/* 眼睛 */
.hk-eye-l, .hk-eye-r { position: absolute; top: 16px; width: 4px; height: 5px; background: #3d2a2f; border-radius: 50%; }
.hk-eye-l { left: 14px; }
.hk-eye-r { right: 14px; }
/* 鼻子 */
.hk-nose { position: absolute; top: 21px; left: 50%; transform: translateX(-50%); width: 4px; height: 3px; background: #f5d77a; border-radius: 50%; }
/* 腮红 */
.hk-blush-l, .hk-blush-r { position: absolute; top: 23px; width: 6px; height: 4px; background: #ffb8c9; border-radius: 50%; opacity: 0.7; }
.hk-blush-l { left: 7px; }
.hk-blush-r { right: 7px; }
/* 胡须 */
.hk-whisker { position: absolute; top: 25px; width: 6px; height: 1px; background: #3d2a2f; }
.hk-whisker.l1 { left: 4px; transform: rotate(15deg); }
.hk-whisker.l2 { left: 4px; top: 28px; transform: rotate(-10deg); }
.hk-whisker.r1 { right: 4px; transform: rotate(-15deg); }
.hk-whisker.r2 { right: 4px; top: 28px; transform: rotate(10deg); }
/* 蝴蝶结（右上） */
.hk-bow { position: absolute; top: -2px; right: 6px; width: 18px; height: 14px; z-index: 3; }
.hk-bow::before, .hk-bow::after { content: ''; position: absolute; top: 0; width: 9px; height: 12px; background: var(--bow-color, #ff9eb5); border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; border: 1px solid #ff5a85; }
.hk-bow::before { left: 0; transform: rotate(-20deg); }
.hk-bow::after { right: 0; transform: rotate(20deg); }
.hk-bow-center { position: absolute; top: 4px; left: 50%; transform: translateX(-50%); width: 4px; height: 4px; background: #ff5a85; border-radius: 50%; z-index: 4; }
/* 身体/小衣服 */
.hk-body { position: absolute; top: 36px; left: 50%; transform: translateX(-50%); width: 36px; height: 22px; background: var(--dress-color, #ffc7d4); border-radius: 8px 8px 4px 4px; border: 1.5px solid #3d2a2f; border-top: none; box-sizing: border-box; }
/* 衣服装饰 */
.hk-body::before { content: ''; position: absolute; top: 3px; left: 50%; transform: translateX(-50%); width: 4px; height: 4px; background: #fff; border-radius: 50%; }
.hk-body::after { content: ''; position: absolute; top: 8px; left: 50%; transform: translateX(-50%); width: 6px; height: 3px; background: var(--dress-color-dark, #f8a8b8); border-radius: 2px; }
/* 手臂 */
.hk-arm-l, .hk-arm-r { position: absolute; top: 40px; width: 6px; height: 8px; background: #ffffff; border: 1px solid #3d2a2f; border-radius: 4px; }
.hk-arm-l { left: 4px; transform: rotate(20deg); }
.hk-arm-r { right: 4px; transform: rotate(-20deg); }
.side-label { font-size: 11px; color: var(--text-dark); font-weight: 600; margin-top: 2px; }

/* =============== 顶部状态栏 =============== */
.status-bar { position: absolute; top: 0; left: 84px; right: 0; height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px 0 12px; font-size: 14px; font-weight: 600; z-index: 50; color: var(--text-dark); background: transparent; }
.status-icons { display: flex; align-items: center; gap: 6px; }
.status-icons svg { width: 16px; height: 16px; }
.battery { background: #ff5a85; color: white; font-size: 11px; padding: 1px 4px; border-radius: 4px; font-weight: 700; }

/* =============== 主内容区 =============== */
.main { position: absolute; top: 44px; left: 84px; right: 0; bottom: 0; overflow-y: auto; padding: 12px 14px 80px 14px; z-index: 10; background: var(--pink-bg); -webkit-overflow-scrolling: touch; transform: translateZ(0); }
.main::-webkit-scrollbar { display: none; }
.page { display: none; }
.page.active { display: block; animation: fadeIn 0.3s; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

/* =============== 通用卡片 =============== */
.card { background: var(--white); border-radius: 20px; padding: 18px; box-shadow: var(--card-shadow); margin-bottom: 14px; }
.card-title { font-size: 17px; font-weight: 700; color: var(--text-dark); display: flex; align-items: center; gap: 6px; margin-bottom: 12px; }
.section-title { font-size: 15px; font-weight: 700; color: var(--text-dark); display: flex; align-items: center; gap: 6px; margin: 6px 0 10px; }
.section-title::before { content: ''; width: 4px; height: 14px; background: var(--pink-deep); border-radius: 2px; }

/* =============== 首页 =============== */
.greeting { text-align: center; padding: 6px 0 4px; }
.greeting-time { font-size: 13px; color: var(--text-light); margin-bottom: 4px; }
.big-time { font-size: 64px; font-weight: 200; color: var(--text-dark); letter-spacing: -2px; line-height: 1; margin: 4px 0; }
.date-line { font-size: 14px; color: var(--text-dark); margin-bottom: 12px; }
.date-line .week { color: var(--pink-deep); margin-left: 8px; font-weight: 600; }

.quote-card { background: linear-gradient(135deg, #fff5f8, #ffe4ec); border-radius: 20px; padding: 22px 18px; margin-bottom: 16px; text-align: center; position: relative; box-shadow: var(--card-shadow); }
.quote-card::before, .quote-card::after { content: '"'; position: absolute; font-size: 40px; color: rgba(244,138,166,0.25); font-family: Georgia, serif; line-height: 1; }
.quote-card::before { top: 8px; left: 14px; }
.quote-card::after { bottom: -8px; right: 14px; }
.quote-cn { font-size: 15px; color: var(--text-dark); line-height: 1.7; margin-bottom: 10px; font-weight: 500; }
.quote-en { font-size: 12px; color: var(--text-light); font-style: italic; line-height: 1.5; }

.checkin-section { margin-top: 6px; }
.checkin-title { font-size: 17px; font-weight: 700; color: var(--text-dark); display: flex; align-items: center; gap: 6px; margin-bottom: 12px; }
.checkin-title::before { content: ''; width: 5px; height: 5px; background: var(--pink-deep); border-radius: 50%; }
.checkin-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.checkin-item { background: var(--white); border-radius: 16px; padding: 12px 6px; text-align: center; box-shadow: 0 3px 10px rgba(244,138,166,0.12); cursor: pointer; transition: all 0.2s; position: relative; overflow: hidden; }
.checkin-item.done { background: linear-gradient(135deg, #fff0f4, #ffd9e3); }
.checkin-item.done::after { content: '✓'; position: absolute; top: 4px; right: 6px; color: var(--pink-deep); font-size: 14px; font-weight: 700; }
.checkin-emoji { font-size: 24px; margin-bottom: 4px; }
.checkin-name { font-size: 12px; color: var(--text-dark); font-weight: 600; }
.checkin-item.done .checkin-name { color: var(--pink-deep); }

.summary-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
.summary-mini { background: var(--white); border-radius: 16px; padding: 12px; box-shadow: var(--card-shadow); }
.summary-mini h4 { font-size: 12px; color: var(--text-light); margin-bottom: 6px; }
.summary-num { font-size: 22px; font-weight: 700; color: var(--pink-deep); }
.summary-mini p { font-size: 11px; color: var(--text-light); margin-top: 2px; }

/* =============== 按钮 =============== */
.btn-primary { width: 100%; padding: 14px; background: linear-gradient(135deg, var(--pink-button), var(--pink-button-deep)); color: white; border: none; border-radius: 30px; font-size: 15px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 12px rgba(244,138,166,0.3); display: flex; align-items: center; justify-content: center; gap: 6px; transition: all 0.2s; }
.btn-primary:active { transform: scale(0.97); }
.btn-secondary { padding: 8px 16px; background: white; color: var(--pink-deep); border: 1.5px solid var(--pink-deep); border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer; }
.btn-soft { padding: 6px 14px; background: #fff0f4; color: var(--pink-deep); border: none; border-radius: 16px; font-size: 12px; font-weight: 600; cursor: pointer; }
.btn-tiny { padding: 3px 8px; background: #fff; color: var(--pink-deep); border: 1px solid var(--pink-mid); border-radius: 12px; font-size: 11px; cursor: pointer; margin-left: 4px; }
.btn-icon { width: 28px; height: 28px; background: #fff0f4; color: var(--pink-deep); border: none; border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; font-size: 14px; }

/* =============== 输入框 =============== */
.input, .textarea, .select { width: 100%; padding: 12px 14px; background: #fff5f8; border: 1.5px solid #fdd9e3; border-radius: 14px; font-size: 14px; color: var(--text-dark); outline: none; transition: all 0.2s; font-family: inherit; }
.input:focus, .textarea:focus, .select:focus { border-color: var(--pink-deep); background: white; }
.textarea { min-height: 100px; resize: vertical; line-height: 1.6; }
.label { display: block; font-size: 12px; color: var(--text-mid); margin-bottom: 6px; font-weight: 600; }
.form-row { margin-bottom: 12px; }
.form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* =============== 列表项 =============== */
.list-item { background: white; border-radius: 16px; padding: 14px; margin-bottom: 10px; box-shadow: 0 3px 10px rgba(244,138,166,0.1); display: flex; align-items: center; gap: 10px; }
.list-item .emoji { font-size: 20px; width: 36px; height: 36px; background: #fff5f8; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
.list-item .body { flex: 1; }
.list-item .title { font-size: 14px; color: var(--text-dark); font-weight: 600; margin-bottom: 2px; }
.list-item .meta { font-size: 11px; color: var(--text-light); }
.list-item.done { opacity: 0.6; }
.list-item.done .title { text-decoration: line-through; }

/* =============== 子导航 =============== */
.subnav { display: flex; gap: 6px; margin-bottom: 14px; overflow-x: auto; padding-bottom: 4px; }
.subnav::-webkit-scrollbar { display: none; }
.subnav-item { flex-shrink: 0; padding: 6px 14px; background: white; border-radius: 18px; font-size: 12px; color: var(--text-mid); cursor: pointer; border: 1.5px solid transparent; white-space: nowrap; }
.subnav-item.active { background: var(--pink-deep); color: white; box-shadow: 0 2px 8px rgba(244,138,166,0.3); }

/* =============== 页面标题 =============== */
.page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; padding: 4px 0; }
.page-title { font-size: 20px; font-weight: 700; color: var(--text-dark); display: flex; align-items: center; gap: 8px; }
.page-title .ico { font-size: 22px; }
.page-tag { padding: 5px 12px; background: white; border-radius: 14px; font-size: 11px; color: var(--text-mid); box-shadow: 0 2px 6px rgba(244,138,166,0.1); }

/* =============== 模态框 =============== */
.modal-mask { position: fixed; inset: 0; background: rgba(74,51,64,0.4); z-index: 200; display: none; align-items: center; justify-content: center; padding: 20px; }
.modal-mask.active { display: flex; animation: fadeIn 0.2s; }
.modal { background: white; border-radius: 24px; padding: 22px; width: 100%; max-width: 380px; max-height: 80vh; overflow-y: auto; box-shadow: 0 20px 50px rgba(0,0,0,0.2); }
.modal h3 { font-size: 17px; color: var(--text-dark); margin-bottom: 14px; font-weight: 700; }

/* =============== 财务表格 =============== */
.fin-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.fin-table th { background: #fff0f4; color: var(--text-dark); padding: 8px 4px; text-align: center; font-weight: 700; border: 1px solid #fdd9e3; }
.fin-table td { padding: 6px 4px; border: 1px solid #fdd9e3; text-align: center; background: white; }
.fin-table td.cat { font-weight: 600; color: var(--text-dark); text-align: left; padding-left: 8px; }
.fin-table td input { width: 100%; border: none; text-align: center; font-size: 12px; color: var(--text-dark); outline: none; padding: 4px; background: transparent; font-family: inherit; }
.fin-table td.total { background: #fff5f8; font-weight: 700; color: var(--pink-deep); }
.fin-table .row-income td { color: var(--green); font-weight: 600; }
.fin-table .row-income td.cat { color: var(--green); }

/* =============== 日历 =============== */
.calendar { background: white; border-radius: 16px; padding: 14px; box-shadow: var(--card-shadow); }
.cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.cal-title { font-size: 16px; font-weight: 700; color: var(--text-dark); }
.cal-nav { display: flex; gap: 6px; }
.cal-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 6px; }
.cal-weekday { text-align: center; font-size: 11px; color: var(--text-light); font-weight: 600; padding: 4px 0; }
.cal-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal-day { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 12px; color: var(--text-dark); border-radius: 8px; cursor: pointer; background: #fff5f8; transition: all 0.2s; position: relative; padding: 2px; }
.cal-day:hover { background: #fdd9e3; }
.cal-day.empty { background: transparent; cursor: default; }
.cal-day.today { background: var(--pink-deep); color: white; font-weight: 700; }
.cal-day.holiday { background: #ffe0e0; color: #d05050; }
.cal-day.workday { background: #fff8e0; }
.cal-day.has-event::after { content: ''; position: absolute; bottom: 3px; width: 4px; height: 4px; background: var(--pink-deep); border-radius: 50%; }
.cal-day.holiday::after { background: #d05050; }
.cal-day .num { font-weight: 600; }
.cal-day .tag { font-size: 8px; margin-top: 1px; opacity: 0.85; }

/* =============== 打卡日历 =============== */
.weight-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 8px; }
.weight-day { aspect-ratio: 1; background: #fff5f8; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 11px; color: var(--text-dark); cursor: pointer; position: relative; }
.weight-day.recorded { background: var(--pink-deep); color: white; }
.weight-day.period { background: #ffd9d9; }
.weight-day .w { font-size: 10px; font-weight: 700; }
.weight-day .p { font-size: 8px; opacity: 0.8; }

/* =============== 日记编辑器 =============== */
.diary-page { background: #fffaf3; min-height: calc(100vh - 200px); border-radius: 16px; padding: 16px; box-shadow: var(--card-shadow); }
.diary-page .textarea { background: transparent; border: none; min-height: 400px; font-size: 15px; line-height: 1.8; color: var(--text-dark); padding: 0; }
.diary-page .textarea:focus { background: transparent; }

/* =============== 评分 =============== */
.score-card { background: linear-gradient(135deg, #fff0f4, #ffe4ec); border-radius: 20px; padding: 18px; box-shadow: var(--card-shadow); }
.score-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.score-label { font-size: 13px; color: var(--text-dark); width: 70px; font-weight: 600; }
.score-bar { flex: 1; height: 8px; background: #fff; border-radius: 4px; overflow: hidden; }
.score-fill { height: 100%; background: linear-gradient(90deg, #ffb8c9, #ff7da0); border-radius: 4px; transition: width 0.3s; }
.score-input { width: 60px; padding: 4px 8px; background: white; border: 1.5px solid #fdd9e3; border-radius: 8px; font-size: 12px; text-align: center; color: var(--text-dark); outline: none; }
.score-total { text-align: center; padding: 14px; background: white; border-radius: 14px; margin-top: 10px; }
.score-total .num { font-size: 32px; font-weight: 700; color: var(--pink-deep); }
.score-total .label { font-size: 12px; color: var(--text-light); }

/* =============== 文档列表 =============== */
.doc-card { background: white; border-radius: 16px; padding: 14px; margin-bottom: 10px; box-shadow: 0 3px 10px rgba(244,138,166,0.1); display: flex; align-items: center; gap: 12px; cursor: pointer; }
.doc-icon { width: 40px; height: 40px; background: linear-gradient(135deg, #ffd9e3, #f8b8c9); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; color: white; }
.doc-info { flex: 1; }
.doc-title { font-size: 14px; font-weight: 600; color: var(--text-dark); margin-bottom: 2px; }
.doc-meta { font-size: 11px; color: var(--text-light); }
.doc-arrow { color: var(--text-light); font-size: 18px; }

/* =============== 36*10 列表 =============== */
.ten-list { background: white; border-radius: 12px; padding: 10px; margin-bottom: 8px; box-shadow: 0 2px 6px rgba(244,138,166,0.08); }
.ten-item { display: flex; align-items: center; gap: 8px; padding: 6px; border-bottom: 1px solid #fff0f4; }
.ten-item:last-child { border-bottom: none; }
.ten-date { width: 60px; font-size: 12px; color: var(--text-dark); font-weight: 600; flex-shrink: 0; }
.ten-content { flex: 1; }
.ten-content input { width: 100%; border: none; background: #fff5f8; border-radius: 8px; padding: 5px 8px; font-size: 12px; color: var(--text-dark); outline: none; }
.ten-status { width: 80px; }
.ten-status select { width: 100%; border: none; background: #fff5f8; border-radius: 8px; padding: 5px 4px; font-size: 11px; color: var(--text-dark); outline: none; }

/* =============== 60天模块 =============== */
.day-block { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; margin: 10px 0; }
.day-cell { aspect-ratio: 1; background: #fff5f8; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 10px; color: var(--text-light); cursor: pointer; }
.day-cell.done { background: var(--pink-deep); color: white; }
.day-cell.today { border: 2px solid var(--pink-deep); }

/* =============== 工具提示 =============== */
.empty-state { text-align: center; padding: 40px 20px; color: var(--text-light); }
.empty-state .emoji { font-size: 40px; margin-bottom: 10px; }
.empty-state p { font-size: 13px; line-height: 1.6; }

/* =============== 时间线 =============== */
.timeline { position: relative; padding-left: 20px; }
.timeline::before { content: ''; position: absolute; left: 6px; top: 0; bottom: 0; width: 2px; background: #fdd9e3; }
.timeline-item { position: relative; padding-bottom: 14px; }
.timeline-item::before { content: ''; position: absolute; left: -18px; top: 4px; width: 10px; height: 10px; background: var(--pink-deep); border-radius: 50%; border: 2px solid white; }
.timeline-time { font-size: 11px; color: var(--pink-deep); font-weight: 700; margin-bottom: 2px; }
.timeline-content { background: white; border-radius: 12px; padding: 10px 12px; box-shadow: 0 2px 6px rgba(244,138,166,0.1); font-size: 13px; color: var(--text-dark); }

/* =============== 月度列表式日历 =============== */
.mv-day-cell { background: transparent; border-radius: 8px; padding: 4px 2px; cursor: pointer; transition: all 0.2s; display: flex; flex-direction: column; min-height: 70px; }
.mv-day-cell:hover { background: #fff5f8; }
.mv-day-cell.today { background: #fff0f4; box-shadow: inset 0 0 0 1.5px var(--pink-deep); }
.mv-day-cell.holiday .mv-day-num { color: #d05050; }

// =============== 数据存储 ===============
const STORE_KEY = 'zhaoxi_workbench_v2';
const defaultData = {
  user: { name: '舒婷' },

  scheduleDate: '', // 日程-今日选中的日期
  scoreDate: '' // 打分系统选中的日期
};

let data = loadData();
function loadData() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return Object.assign(JSON.parse(JSON.stringify(defaultData)), JSON.parse(raw));
    // v1数据迁移
    const v1 = localStorage.getItem('zhaoxi_workbench_v1');
    if (v1) {
      const migrated = Object.assign(JSON.parse(JSON.stringify(defaultData)), JSON.parse(v1));
      try { localStorage.setItem(STORE_KEY, JSON.stringify(migrated)); } catch(e) {}
      return migrated;
    }
    // 尝试从备份恢复
    const backup = localStorage.getItem(STORE_KEY + '_backup');
    if (backup) return Object.assign(JSON.parse(JSON.stringify(defaultData)), JSON.parse(backup));
  } catch(e) {
    console.warn('数据加载异常，尝试备份:', e);
    try {
      const backup = localStorage.getItem(STORE_KEY + '_backup');
      if (backup) return Object.assign(JSON.parse(JSON.stringify(defaultData)), JSON.parse(backup));
    } catch(e2) {}
  }
  return JSON.parse(JSON.stringify(defaultData));
}

// 防抖保存：避免频繁输入时频繁写入
let saveTimer = null;
let savePending = false;
function saveData() {
  savePending = true;
  if (saveTimer) return;
  saveTimer = setTimeout(() => {
    saveTimer = null;
    if (!savePending) return;
    savePending = false;
    _doSave();
  }, 150);
}
// 立即保存（用于关键操作）
function saveDataNow() {
  if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }
  savePending = false;
  _doSave();
}
function _doSave() {
  try {
    const str = JSON.stringify(data);
    localStorage.setItem(STORE_KEY, str);
    // 同时写入备份（每次主数据超过10KB才备份，避免频繁写入）
    if (str.length > 10000) {
      try { localStorage.setItem(STORE_KEY + '_backup', str); } catch(e) {}
    }
  } catch(e) {
    // 主存储写入失败（如配额超限），尝试清理旧备份后重试
    try {
      localStorage.removeItem(STORE_KEY + '_backup');
      localStorage.setItem(STORE_KEY, JSON.stringify(data));
    } catch(e2) {
      console.error('保存失败:', e2);
      showToast('⚠️ 存储空间不足，建议导出备份');
    }
  }
}

// 页面卸载前立即保存
window.addEventListener('beforeunload', () => { saveDataNow(); });
window.addEventListener('pagehide', () => { saveDataNow(); });
document.addEventListener('visibilitychange', () => {

function bindBackupEvents() {
  const exportBtn = document.getElementById('exportDataBtn');
  if (exportBtn) {

      saveDataNow();

      const blob = new Blob([json], { type: 'application/json' });

      const a = document.createElement('a');
      a.href = url;
      a.download = `昭熹工作台_备份_${currentDate}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('备份已导出 ✨');
    };
  }
  const importBtn = document.getElementById('importDataBtn');
  const fileInput = document.getElementById('importFileInput');
  if (importBtn && fileInput) {
    importBtn.onclick = () => fileInput.click();
    fileInput.onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const imported = JSON.parse(ev.target.result);
          if (confirm('确认导入备份吗？当前数据将被覆盖。')) {
            data = Object.assign(JSON.parse(JSON.stringify(defaultData)), imported);

          }
        } catch (err) {
          alert('文件格式错误，请选择正确的备份文件');

      };
      reader.readAsText(file);
    };
  }
  // 云端同步按钮
  const cloudSyncBtn = document.getElementById('cloudSyncBtn');
  if (cloudSyncBtn) {
    cloudSyncBtn.onclick = openCloudSyncDialog;
  }
  // 显示存储信息

  if (info) {

    } catch(e) {}
  }
}

async function cloudUpload() {
  const token = document.getElementById('gistToken').value.trim();
  const gistId = document.getElementById('gistId').value.trim();
  const result = document.getElementById('cloudSyncResult');
  if (!token) { result.innerHTML = '<span style="color:var(--red);">请先填写 GitHub Token</span>'; return; }
  result.innerHTML = '<span style="color:var(--text-light);">正在上传...</span>';
  saveDataNow();
  const content = JSON.stringify(data);
  try {
    let url = 'https://api.github.com/gists';
    let method = 'POST';
    let body = { files: { 'zhaoxi_backup.json': { content: content } }, description: '昭熹工作台数据备份' };
    if (gistId) { url = `https://api.github.com/gists/${gistId}`; method = 'PATCH'; }
    const resp = await fetch(url, {
      method: method,
      headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    if (!resp.ok) { const e = await resp.json(); throw new Error(e.message || resp.status); }
    const json = await resp.json();
    if (!gistId && json.id) {
      localStorage.setItem('zhaoxi_gist_id', json.id);
      document.getElementById('gistId').value = json.id;
    }
    const now = new Date().toLocaleString('zh-CN');
    localStorage.setItem('zhaoxi_last_cloud_sync', now);
    result.innerHTML = `<span style="color:var(--green);">✓ 上传成功！${now}</span>`;
    showToast('云端同步成功 ✨');
  } catch (e) {
    result.innerHTML = `<span style="color:var(--red);">✗ 失败：${escapeHtml(e.message)}</span>`;
  }
}

async function cloudDownload() {
  const token = document.getElementById('gistToken').value.trim();
  const gistId = document.getElementById('gistId').value.trim();
  const result = document.getElementById('cloudSyncResult');
  if (!token || !gistId) { result.innerHTML = '<span style="color:var(--red);">请先填写 Token 和 Gist ID</span>'; return; }
  result.innerHTML = '<span style="color:var(--text-light);">正在下载...</span>';
  try {
    const resp = await fetch(`https://api.github.com/gists/${gistId}`, {
      headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' }
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const json = await resp.json();
    const file = json.files['zhaoxi_backup.json'];
    if (!file) throw new Error('云端无备份数据');
    const imported = JSON.parse(file.content);
    if (!confirm('确认从云端恢复吗？当前数据将被覆盖。')) { result.innerHTML = ''; return; }
    data = Object.assign(JSON.parse(JSON.stringify(defaultData)), imported);
    saveDataNow();
    const now = new Date().toLocaleString('zh-CN');
    localStorage.setItem('zhaoxi_last_cloud_sync', now);
    result.innerHTML = `<span style="color:var(--green);">✓ 恢复成功！${now}</span>`;
    showToast('云端恢复成功 ✨');
    setTimeout(() => { closeModal(); renderPage(); }, 1500);
  } catch (e) {
    result.innerHTML = `<span style="color:var(--red);">✗ 失败：${escapeHtml(e.message)}</span>`;
  }
}

  let weeks = [];

  for (let d = 1; d <= totalDays; d++) {
    const dateKey = `${monthViewYear}-${String(monthViewMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;

    const holiday = chineseHolidays[dateKey];

    curWeek.push({ d, dateKey, isToday, lunar, holiday, events });
    if (curWeek.length === 7) { weeks.push(curWeek); curWeek = []; }

function firstWeekdayOfMonth() {
  return new Date(monthViewYear, monthViewMonth, 1).getDay();
}

// 简易农历标签（基于内置对照表，仅展示常用日期）
function getLunarLabel(y, m, d) {
  const key = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  const holiday = chineseHolidays[key];
  if (holiday) return holiday;
  // 简化版：用阳历近似农历月日
  const lunarMap = {
    '2026-08-04': '廿', '2026-08-19': '七夕'
  };
  if (lunarMap[key]) return lunarMap[key];
  // 用一个简化的偏移：取阳历月日差
  return '';
}

// 事项分类颜色（用户指定）
// 紫色-幸福 红色-工作 橙色-生活 绿色-娱乐 粉色-其他
const eventCategories = [
  { key: '幸福', color: '#c5b8e8', text: '#5a4a7a' },
  { key: '工作', color: '#ef9a9a', text: '#7a3a3a' },
  { key: '生活', color: '#ffd29e', text: '#7a5a3a' },
  { key: '娱乐', color: '#b8e6c7', text: '#3a6a4a' },
  { key: '其他', color: '#ffd9e3', text: '#7a4a5a' }
];
function getCategoryColor(cat) {
  const c = eventCategories.find(e => e.key === cat);
  return c || eventCategories[eventCategories.length - 1];
}

function pickEventColor(text) {
  const colors = ['#ffd9e3', '#b8e6c7', '#f5d77a', '#c5b8e8', '#ffd29e', '#a8d8e8', '#ffb8c9'];
  let hash = 0;
  for (let i = 0; i < text.length; i++) hash = (hash * 31 + text.charCodeAt(i)) & 0xffff;
  return colors[hash % colors.length];
}

// 月度事项 <-> 今日重点 双向同步
// 数据模型：data.monthEvents[dateKey] = [{id, content, category}]
// 今日重点文本 = 该日所有事项内容用「·」连接
function getFocusFromEvents(dateKey) {
  const items = data.monthEvents[dateKey] || [];
  return items.map(it => it.content).join(' · ');
}
// 同步：今日重点文本改变时，尝试解析为事项列表（按 · 分隔）
function syncEventsFromFocus(dateKey, text) {
  if (!text || !text.trim()) {
    data.monthEvents[dateKey] = [];
    return;
  }
  const parts = text.split(/[·,，\n]/).map(s => s.trim()).filter(Boolean);
  // 保留原有事项的 category（按顺序匹配）
  const oldItems = data.monthEvents[dateKey] || [];
  data.monthEvents[dateKey] = parts.map((p, i) => ({
    id: (oldItems[i] && oldItems[i].id) || ('e_' + Date.now() + '_' + i + '_' + Math.random().toString(36).substr(2,4)),
    content: p,
    category: (oldItems[i] && oldItems[i].category) || '其他'
  }));
}
// 添加一条月度事项
function addMonthEvent(dateKey, content, category) {
  if (!data.monthEvents[dateKey]) data.monthEvents[dateKey] = [];
  data.monthEvents[dateKey].push({
    id: 'e_' + Date.now() + '_' + Math.random().toString(36).substr(2,5),
    content: content,
    category: category || '其他'
  });
}
// 删除一条月度事项
function deleteMonthEvent(dateKey, id) {
  if (!data.monthEvents[dateKey]) return;
  data.monthEvents[dateKey] = data.monthEvents[dateKey].filter(e => e.id !== id);
  if (data.monthEvents[dateKey].length === 0) delete data.monthEvents[dateKey];
}

function bindScheduleMonthEvents() {
  // 月份选择器
  const mp = document.getElementById('mvMonthPick');
  if (mp) {
    mp.onchange = () => {
      const [y, m] = mp.value.split('-');
      monthViewYear = parseInt(y);
      monthViewMonth = parseInt(m) - 1;
      // 同步到今日页面日期
      currentDate = `${y}-${m}-01`;
      renderPage();
    };
  }
  // 上月/下月导航按钮
  const prevBtn = document.getElementById('mvPrevMonth');
  if (prevBtn) {
    prevBtn.onclick = () => {
      monthViewMonth--;
      if (monthViewMonth < 0) { monthViewMonth = 11; monthViewYear--; }
      renderPage();
    };
  }
  const nextBtn = document.getElementById('mvNextMonth');
  if (nextBtn) {
    nextBtn.onclick = () => {
      monthViewMonth++;
      if (monthViewMonth > 11) { monthViewMonth = 0; monthViewYear++; }
      renderPage();
    };
  }
  // 点击日期格子 —— 有事项的打开详情面板，空格子直接弹出添加对话框
  document.querySelectorAll('.mv-day-cell').forEach(d => {
    d.onclick = (e) => {
      // 如果点击的是事项标签，由标签自己处理删除
      if (e.target.classList.contains('mv-event-tag')) return;
      currentDate = d.dataset.mvday;
      const events = data.monthEvents[currentDate] || [];
      if (events.length > 0) {
        // 有事项 —— 打开详情面板
        renderMonthDayDetail();
        setTimeout(() => {
          const det = document.getElementById('monthDayDetail');
          if (det) det.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 50);
      } else {
        // 空格子 —— 直接弹出添加对话框
        openMonthAddDialog();
      }
    };
  });
  // 点击 + 提示 —— 直接打开添加对话框
  document.querySelectorAll('.mv-add-hint').forEach(h => {
    h.onclick = (e) => {
      e.stopPropagation();
      currentDate = h.dataset.mvadd;
      openMonthAddDialog();
    };
  });
  // 点击事项标签 —— 直接删除
  document.querySelectorAll('.mv-event-tag').forEach(tag => {
    tag.onclick = (e) => {
      e.stopPropagation();
      const id = tag.dataset.evid;
      const dateKey = tag.dataset.evdate;
      if (confirm('删除该事项吗？')) {
        deleteMonthEvent(dateKey, id);
        saveData();
        renderPage();
      }
    };
  });
}

function openMonthAddDialog() {
  showModal(`➕ 添加事项 - ${formatDate(new Date(currentDate))}`, `
    <div class="form-row">
      <label class="label">事项内容</label>
      <input class="input" id="mvNewContent" placeholder="如：开会、瑜伽、约会..." autofocus>

            <input type="radio" name="catRadio" value="${c.key}" ${i === 0 ? 'checked' : ''} style="display:none;">
            <span style="display:inline-block;width:12px;height:12px;background:${c.color};border-radius:3px;"></span>
            ${c.key}
          </label>
        `).join('')}
      </div>

  `, null, true);

  document.querySelectorAll('.cat-label').forEach(lbl => {
    lbl.onclick = () => {
      document.querySelectorAll('.cat-label').forEach(l => l.style.borderColor = 'transparent');
      lbl.style.borderColor = 'var(--pink-deep)';

    };

      const cat = document.querySelector('input[name="catRadio"]:checked').value;
      addMonthEvent(currentDate, c, cat);
      saveData();
      closeModal();
      renderPage();
    };
  }
}

      syncEventsFromFocus(currentDate, f.value);
      saveData();
    };
  }
  // 添加事项
  const addBtn = document.getElementById('mvAddBtn');
  if (addBtn) {
    addBtn.onclick = () => {

      const cat = document.getElementById('mvNewCat').value;

      // 同时刷新月度格子
      refreshMonthGridOnly();

  document.querySelectorAll('[data-mv-del-ev]').forEach(b => {
    b.onclick = () => {
      deleteMonthEvent(currentDate, b.dataset.mvDelEv);

      renderMonthDayDetail();
      refreshMonthGridOnly();
    };
  });
}

// 只刷新月度格子（不重渲染详情，避免输入框失焦）
function refreshMonthGridOnly() {
  // 简单做法：重渲染整个页面
  renderPage();
  // 重新打开详情
  setTimeout(() => renderMonthDayDetail(), 0);
}

function bindScheduleTodayEvents() {
  const selDate = data.scheduleDate || currentDate;
  // 日期选择器 —— 选择日期后跳转，同时同步月度视图月份
  const datePick = document.getElementById('schedDatePick');
  if (datePick) {
    datePick.onchange = () => {
      data.scheduleDate = datePick.value;
      // 同步月度视图的年月
      const [y, m] = datePick.value.split('-');
      monthViewYear = parseInt(y);
      monthViewMonth = parseInt(m) - 1;
      // 同步 currentDate
      currentDate = datePick.value;
      saveData();
      renderPage();
    };
  }
  const focusEl = document.getElementById('focusText');
  if (focusEl) {
    focusEl.oninput = () => {
      // 今日重点 与 月度事项 双向同步
      syncEventsFromFocus(selDate, focusEl.value);
      saveData();
    };
  }
  document.querySelectorAll('[data-del-schedule]').forEach(btn => {
    btn.onclick = () => {
      const idx = parseInt(btn.dataset.delSchedule);
      if (data.schedule[selDate]) {
        data.schedule[selDate].splice(idx, 1);
        saveData();
        renderPage();
      }
    };
  });
  const addBtn = document.getElementById('addSchedBtn');
  if (addBtn) {
    addBtn.onclick = () => {
      const t = document.getElementById('newSchedTime').value;
      const c = document.getElementById('newSchedContent').value.trim();
      if (!c) { alert('请输入日程内容'); return; }
      if (!data.schedule[selDate]) data.schedule[selDate] = [];
      data.schedule[selDate].push({ time: t, content: c });
      data.schedule[selDate].sort((a, b) => a.time.localeCompare(b.time));
      saveData();
      renderPage();
    };
  }
  document.querySelectorAll('[data-todo-toggle]').forEach(el => {
    el.onclick = () => {
      const id = el.dataset.todoToggle;
      const todo = (data.todos || []).find(t => t.id === id);
      if (todo) { todo.done = !todo.done; saveData(); renderPage(); }
    };
  });
}

let currentYear = 2026;
let currentMonth = 7; // 0-indexed, 7 means August

function renderScheduleYear() {
  const now = new Date();
  if (!currentYear) currentYear = now.getFullYear();
  if (currentMonth === undefined) currentMonth = now.getMonth();
  return `
    <div class="page-header">
      <div class="page-title">📅 年度日历</div>
      <div class="page-tag">从2026年起持续更新</div>
    </div>
    <div class="card" style="padding:0;background:transparent;box-shadow:none;">
      <div class="calendar">
        <div class="cal-header">
          <div class="cal-nav">
            <button class="btn-icon" id="yearPrev">‹</button>
            <button class="btn-icon" id="yearNext">›</button>
          </div>
          <div class="cal-title">${currentYear}年 ${currentMonth + 1}月</div>
          <div class="cal-nav">
            <button class="btn-icon" id="monthPrev">‹</button>
            <button class="btn-icon" id="monthNext">›</button>
          </div>
        </div>

          ${['日','一','二','三','四','五','六'].map(w => `<div class="cal-weekday">${w}</div>`).join('')}

      </div>

      <div class="empty-state" style="padding:20px;"><p>点击日期查看当日详情</p></div>
    </div>
  `;
}

function renderCalendarDays() {
  const el = document.getElementById('calDays');
  if (!el) return;
  const firstDay = new Date(currentYear, currentMonth, 1);
  const lastDay = new Date(currentYear, currentMonth + 1, 0);
  const today = new Date();
  let html = '';
  for (let i = 0; i < firstDay.getDay(); i++) html += '<div class="cal-day empty"></div>';
  for (let d = 1; d <= lastDay.getDate(); d++) {
    const dateKey = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const isToday = today.getFullYear() === currentYear && today.getMonth() === currentMonth && today.getDate() === d;
    const holiday = chineseHolidays[dateKey];
    const hasEvent = (data.schedule[dateKey] || []).length > 0 || (data.todos || []).some(t => t.date === dateKey);
    let cls = 'cal-day';
    if (isToday) cls += ' today';
    else if (holiday) cls += ' holiday';
    if (hasEvent) cls += ' has-event';
    html += `<div class="${cls}" data-day="${dateKey}">
      <div class="num">${d}</div>
      ${holiday ? `<div class="tag">${holiday.substring(0,2)}</div>` : ''}
    </div>`;
  }
  el.innerHTML = html;
  el.querySelectorAll('.cal-day:not(.empty)').forEach(d => {
    d.onclick = () => {
      currentDate = d.dataset.day;
      renderDayDetail();
      document.querySelectorAll('.cal-day').forEach(x => x.style.outline = '');
      d.style.outline = '2px solid var(--pink-deep)';
    };
  });
}

function renderDayDetail() {
  const el = document.getElementById('dayDetail');
  if (!el) return;
  const dateObj = new Date(currentDate);
  const holiday = chineseHolidays[currentDate];
  const daySchedule = data.schedule[currentDate] || [];
  const dayTodos = (data.todos || []).filter(t => t.date === currentDate);
  const focus = data.schedule['__focus_' + currentDate] || '';
  el.innerHTML = `
    <div class="card-title">📌 ${formatDate(dateObj)} 星期${getWeekday(dateObj)}${holiday ? ` · ${holiday}` : ''}</div>
    <div class="form-row">
      <label class="label">今日重点</label>
      <textarea class="textarea" id="dayFocus" placeholder="写下今天最重要的事...">${escapeHtml(focus)}</textarea>
    </div>
    <div class="form-row">
      <label class="label">时间安排</label>
      ${daySchedule.length === 0 ? '<div class="text-light" style="padding:8px 0;">暂无安排</div>' : ''}
      ${daySchedule.map((s, i) => `
        <div style="display:flex;gap:6px;align-items:center;margin-bottom:6px;">
          <span style="font-size:12px;color:var(--pink-deep);font-weight:600;width:50px;">${s.time}</span>
          <span style="flex:1;font-size:13px;">${escapeHtml(s.content)}</span>
          <button class="btn-tiny" data-day-del="${i}">×</button>
        </div>
      `).join('')}
      <div style="display:flex;gap:6px;margin-top:8px;">
        <input class="input" id="dayNewTime" type="time" value="09:00" style="width:100px;">
        <input class="input" id="dayNewContent" placeholder="日程..." style="flex:1;">
        <button class="btn-icon" id="dayAddBtn" style="background:var(--pink-deep);color:white;">+</button>
      </div>
    </div>
    ${dayTodos.length > 0 ? `
      <div class="form-row">
        <label class="label">待办</label>
        ${dayTodos.map(t => `<div style="font-size:13px;padding:4px 0;">${t.done ? '✅' : '⭕'} ${escapeHtml(t.title)}</div>`).join('')}
      </div>
    ` : ''}
  `;
  const focusIn = document.getElementById('dayFocus');
  if (focusIn) focusIn.oninput = () => { data.schedule['__focus_' + currentDate] = focusIn.value; saveData(); };
  const addBtn = document.getElementById('dayAddBtn');
  if (addBtn) {
    addBtn.onclick = () => {
      const t = document.getElementById('dayNewTime').value;
      const c = document.getElementById('dayNewContent').value.trim();
      if (!c) return;
      if (!data.schedule[currentDate]) data.schedule[currentDate] = [];
      data.schedule[currentDate].push({ time: t, content: c });
      data.schedule[currentDate].sort((a, b) => a.time.localeCompare(b.time));
      saveData();
      renderCalendarDays();
      renderDayDetail();
    };
  }
  document.querySelectorAll('[data-day-del]').forEach(b => {
    b.onclick = () => {
      const i = parseInt(b.dataset.dayDel);
      if (data.schedule[currentDate]) { data.schedule[currentDate].splice(i, 1); saveData(); renderCalendarDays(); renderDayDetail(); }
    };
  });
}

function bindScheduleYearEvents() {
  document.getElementById('yearPrev').onclick = () => { currentYear--; renderPage(); };
  document.getElementById('yearNext').onclick = () => { currentYear++; renderPage(); };
  document.getElementById('monthPrev').onclick = () => {
    currentMonth--;
    if (currentMonth < 0) { currentMonth = 11; currentYear--; }
    renderPage();
  };
  document.getElementById('monthNext').onclick = () => {
    currentMonth++;
    if (currentMonth > 11) { currentMonth = 0; currentYear++; }
    renderPage();
  };
  renderCalendarDays();
}

function renderSelf() {
  const sub = currentSubPage.self || 'important';
  const subNav = `
    <div class="subnav">
      ${Object.entries(subPagesConfig.self).map(([k, v]) => `
        <div class="subnav-item ${sub === k ? 'active' : ''}" data-sub="${k}">${v}</div>
      `).join('')}
    </div>
  `;
  let body = '';
  if (sub === 'important') body = renderDocs('importantDocs', '重要目标', '🎯');
  else if (sub === 'year') body = renderDocs('yearPlans', '年度计划', '📋');
  else if (sub === 'month') body = renderDocs('monthPlans', '月度计划', '📆');
  else if (sub === 'finance') body = renderFinance();
  return subNav + body;
}

function renderDocs(storeKey, title, icon) {
  const docs = (data[storeKey] || []).slice().sort((a, b) => b.createdAt - a.createdAt);
  return `
    <div class="page-header">
      <div class="page-title">${icon} ${title}</div>
      <div class="page-tag">${docs.length}个文档</div>
    </div>
    <div class="card" id="docsList">
      ${docs.length === 0 ? `
        <div class="empty-state">
          <div class="emoji">📝</div>
          <p>还没有创建任何文档<br>点击下方按钮新建</p>
        </div>
      ` : docs.map(d => `
        <div class="doc-card" data-doc-id="${d.id}">
          <div class="doc-icon">${icon}</div>
          <div class="doc-info">
            <div class="doc-title">${escapeHtml(d.title)}</div>
            <div class="doc-meta">${new Date(d.createdAt).toLocaleString('zh-CN')}</div>
          </div>
          <div class="doc-arrow">›</div>
        </div>
      `).join('')}
    </div>
    <button class="btn-primary" id="newDocBtn">+ 新建文档</button>
  `;
}

function bindDocEvents(storeKey) {
  document.getElementById('newDocBtn').onclick = () => {
    showModal(`新建文档`, `
      <div class="form-row">
        <label class="label">文档标题</label>
        <input class="input" id="newDocTitle" placeholder="请输入文档标题...">
      </div>
      <button class="btn-primary" id="confirmNewDoc">创建文档</button>
    `, () => {
      const t = document.getElementById('newDocTitle').value.trim();
      if (!t) { alert('请输入标题'); return; }
      if (!data[storeKey]) data[storeKey] = [];
      data[storeKey].push({
        id: 'd_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
        title: t,
        createdAt: Date.now(),
        content: ''
      });
      saveData();
      closeModal();
      renderPage();
    });
  };
  document.querySelectorAll('.doc-card').forEach(c => {
    c.onclick = () => {
      const id = c.dataset.docId;
      const doc = (data[storeKey] || []).find(d => d.id === id);
      if (doc) openDocEditor(storeKey, doc);
    };
  });
}

function openDocEditor(storeKey, doc) {
  const original = doc.content || '';
  showModal(`✏️ ${escapeHtml(doc.title)}`, `
    <div class="diary-page" style="min-height:300px;">
      <textarea class="textarea" id="docContent" style="min-height:280px;">${escapeHtml(original)}</textarea>
    </div>
    <div style="display:flex;gap:8px;margin-top:10px;">
      <button class="btn-secondary" id="renameDocBtn" style="flex:1;">重命名</button>
      <button class="btn-secondary" id="deleteDocBtn" style="flex:1;color:#d05050;border-color:#d05050;">删除</button>
      <button class="btn-primary" id="saveDocBtn" style="flex:2;">保存</button>
    </div>
  `, null, true);
  document.getElementById('saveDocBtn').onclick = () => {
    doc.content = document.getElementById('docContent').value;
    saveData();
    showToast('保存成功 ✨');
    closeModal();
    renderPage();
  };
  document.getElementById('renameDocBtn').onclick = () => {
    const newT = prompt('新标题', doc.title);
    if (newT && newT.trim()) { doc.title = newT.trim(); saveData(); closeModal(); openDocEditor(storeKey, doc); }
  };
  document.getElementById('deleteDocBtn').onclick = () => {
    if (confirm('确认删除该文档吗？')) {
      data[storeKey] = data[storeKey].filter(d => d.id !== doc.id);
      saveData();
      closeModal();
      renderPage();
    }

}

function renderFinanceTable() {

    </div>
  `;

function calcFinanceRow() {
  const key = `${currentFinanceYear}-${String(currentFinanceMonth).padStart(2, '0')}`;
  const monthData = data.finances[key];
  if (!monthData) return;
  let totalTarget = 0, totalActual = 0, incomeActual = 0;
  let hasTarget = false, hasActual = false;
  financeCategories.forEach(cat => {
    const row = monthData.rows[cat.key] || {};
    if (row.target && !isNaN(parseFloat(row.target))) {
      const v = parseFloat(row.target);
      totalTarget += cat.type === 'income' ? v : -v;
      hasTarget = true;
    }
    if (row.actual && !isNaN(parseFloat(row.actual))) {
      const v = parseFloat(row.actual);
      if (cat.type === 'income') incomeActual += v;
      else totalActual += v;
      hasActual = true;
    }
  });
  const tt = document.getElementById('ftotalTarget');
  const ta = document.getElementById('ftotalActual');
  if (tt) tt.textContent = hasTarget ? (totalTarget >= 0 ? '+' : '') + totalTarget.toFixed(2) : '-';
  if (ta) ta.textContent = hasActual ? '-' + totalActual.toFixed(2) : '-';
  const calc = document.getElementById('financeCalcResult');
  if (calc) {
    const balance = incomeActual - totalActual;
    calc.innerHTML = `实际结余：<span style="color:${balance >= 0 ? 'var(--green)' : 'var(--red)'};font-weight:700;">${balance >= 0 ? '+' : ''}${balance.toFixed(2)}</span>`;
  }
}

function renderFinanceYearSummary() {
  let yearIncome = 0, yearExpense = 0;
  const monthly = [];
  for (let m = 1; m <= 12; m++) {
    const k = `${currentFinanceYear}-${String(m).padStart(2, '0')}`;
    const month = data.finances[k];
    let mi = 0, me = 0;
    if (month) {
      financeCategories.forEach(cat => {
        const row = month.rows[cat.key] || {};
        const v = parseFloat(row.actual) || 0;
        if (cat.type === 'income') mi += v;
        else me += v;
      });
    }
    monthly.push({ m, mi, me, balance: mi - me });
    yearIncome += mi;
    yearExpense += me;
  }
  const balance = yearIncome - yearExpense;
  return `
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px;">
      <div style="background:#fff5f8;padding:10px;border-radius:12px;text-align:center;">
        <div style="font-size:11px;color:var(--text-light);">年收入</div>
        <div style="font-size:16px;font-weight:700;color:var(--green);">+${yearIncome.toFixed(2)}</div>
      </div>
      <div style="background:#fff5f8;padding:10px;border-radius:12px;text-align:center;">
        <div style="font-size:11px;color:var(--text-light);">年支出</div>
        <div style="font-size:16px;font-weight:700;color:var(--red);">-${yearExpense.toFixed(2)}</div>
      </div>
      <div style="background:#fff5f8;padding:10px;border-radius:12px;text-align:center;">
        <div style="font-size:11px;color:var(--text-light);">结余</div>
        <div style="font-size:16px;font-weight:700;color:${balance >= 0 ? 'var(--green)' : 'var(--red)'};">${balance >= 0 ? '+' : ''}${balance.toFixed(2)}</div>
      </div>
    </div>
    <table class="fin-table">
      <thead><tr><th>月份</th><th>收入</th><th>支出</th><th>结余</th></tr></thead>
      <tbody>
        ${monthly.map(mt => `
          <tr>
            <td class="cat">${mt.m}月</td>
            <td>${mt.mi ? '+' + mt.mi.toFixed(2) : '-'}</td>
            <td>${mt.me ? '-' + mt.me.toFixed(2) : '-'}</td>
            <td class="total" style="color:${mt.balance >= 0 ? 'var(--green)' : 'var(--red)'};">${mt.mi || mt.me ? (mt.balance >= 0 ? '+' : '') + mt.balance.toFixed(2) : '-'}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}

  document.querySelectorAll('[data-fmonth]').forEach(el => {

  // 历史
  const history = Object.keys(data.scores).sort().reverse().slice(0, 10);
  const avgAll = history.length > 0 ? (history.reduce((sum, k) => sum + (data.scores[k].total || 0), 0) / history.length).toFixed(1) : 0;
  const dateObj = new Date(selDate);
  const isToday = selDate === currentDate;
  return `

        <input type="number" class="score-input" data-sf="work" value="${today.work || 0}" min="0" max="40">

function bindScoreEvents() {
  const selDate = data.scoreDate || currentDate;
  // 日期选择器
  const datePick = document.getElementById('scoreDatePick');
  if (datePick) {
    datePick.onchange = () => {
      data.scoreDate = datePick.value;
      saveData();
      renderPage();
    };
  }
  document.querySelectorAll('[data-sf]').forEach(inp => {
    inp.oninput = () => {
      if (!data.scores[selDate]) data.scores[selDate] = { work: 0, life: 0, health: 0, growth: 0, quote: '' };
      data.scores[selDate][inp.dataset.sf] = parseInt(inp.value) || 0;
      const s = data.scores[selDate];
      s.total = (s.work || 0) + (s.life || 0) + (s.health || 0) + (s.growth || 0);
      saveData();
      const totalEl = document.querySelector('.score-total .num');
      if (totalEl) totalEl.textContent = s.total;
    };
  });
  const q = document.getElementById('scoreQuote');
  if (q) {
    let timer;
    q.oninput = () => {
      clearTimeout(timer);
      timer = setTimeout(() => {
        if (!data.scores[selDate]) data.scores[selDate] = { work: 0, life: 0, health: 0, growth: 0, quote: '' };
        data.scores[selDate].quote = q.value;
        saveData();
      }, 500);
    };
  }
}

// =============== 页面事件绑定 ===============
function bindPageEvents() {
  // 通用子导航
  document.querySelectorAll('.subnav-item[data-sub]').forEach(el => {
    el.onclick = () => {
      navigateTo(currentPage, el.dataset.sub);
    };
  });
  // 路由到绑定
  if (currentPage === 'home') { bindHomeEvents(); bindBackupEvents(); }
  else if (currentPage === 'schedule') {
    if (currentSubPage.schedule === 'today') bindScheduleTodayEvents();
    else if (currentSubPage.schedule === 'month') bindScheduleMonthEvents();
    else if (currentSubPage.schedule === 'year') bindScheduleYearEvents();
  }
  else if (currentPage === 'self') {
    const sub = currentSubPage.self || 'important';
    if (sub === 'important') bindDocEvents('importantDocs');
    else if (sub === 'year') bindDocEvents('yearPlans');
    else if (sub === 'month') bindDocEvents('monthPlans');
    else if (sub === 'finance') bindFinanceEvents();
  }
  else if (currentPage === 'happiness') bindHappinessEvents();
  else if (currentPage === 'health') {
    const sub = currentSubPage.health || 'weight';
    if (sub === 'weight') bindWeightEvents();
    else if (sub === 'shaping') bindShapingEvents();
    else if (sub === 'beauty') bindBeautyEvents();
    else if (sub === 'appearance') bindAppearanceEvents();
    else if (sub === 'routine') bindRoutineEvents();
    else bindHealthCustomEvents();
    bindAddHealthBtn();
  }
  else if (currentPage === 'growth') {
    const sub = currentSubPage.growth || 'skill';
    if (sub === 'skill') bindSkillEvents();
    else if (sub === 'ten') bindTenEvents();
    else if (sub === 'sixty') bindSixtyEvents();
    else bindGrowthCustomEvents();
    bindAddGrowthBtn();
  }
  else if (currentPage === 'notebook') bindNotebookEvents();
  else if (currentPage === 'score') bindScoreEvents();
}

// =============== 模态框 ===============
function showModal(title, content, onConfirm, noFooter) {
  const mask = document.getElementById('modalMask');
  const modal = document.getElementById('modalContent');
  modal.innerHTML = `
    <div class="between" style="margin-bottom:14px;">
      <h3 style="margin:0;">${title}</h3>
      <button class="btn-icon" id="closeModal">×</button>
    </div>
    ${content}
  `;
  mask.classList.add('active');
  document.getElementById('closeModal').onclick = closeModal;
  mask.onclick = (e) => { if (e.target === mask && !noFooter) closeModal(); };
  if (onConfirm) {
    const btn = modal.querySelector('#confirmNewDoc, #confirmNewSkill, #confirmNewSixty');
    if (btn) btn.onclick = onConfirm;
  }
}
function closeModal() {
  document.getElementById('modalMask').classList.remove('active');
}
function showToast(msg) {
  const t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(74,51,64,0.85);color:white;padding:10px 20px;border-radius:20px;font-size:13px;z-index:9999;animation:fadeIn 0.3s;';
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 1500);
}

// =============== 工具 ===============
function escapeHtml(s) {
  if (s === undefined || s === null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s) {
  return escapeHtml(s);
}

  const now = new Date();
  const time = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

  if (st) st.textContent = time;

  // 和风天气图标代码映射

  return iconMap[code] || '🌤️';

function loadWeather() {
  const weatherBox = document.getElementById('weatherBox');
  if (!weatherBox) return;

  // 先尝试从缓存读取（每30分钟刷新一次）
  const cached = localStorage.getItem('weatherCache');
  if (cached) {
    try {
      const w = JSON.parse(cached);
      const age = Date.now() - w.timestamp;
      if (age < 30 * 60 * 1000) {
        displayWeather(w);
        return;
      }
    } catch(e) {}
  }

  // 尝试获取地理位置
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      (pos) => fetchWeatherByCoords(pos.coords.latitude, pos.coords.longitude),
      () => fetchWeatherByIP(),
      { timeout: 5000, maximumAge: 600000 }
    );
  } else {
    fetchWeatherByIP();
  }
}

function fetchWeatherByCoords(lat, lon) {
  // 使用和风天气免费 API（不需要 key 的简化版通过城市查询）
  // 先通过经纬度查城市名
  fetch(`https://geocoding-api.open-meteo.com/v1/reverse?latitude=${lat}&longitude=${lon}&language=zh`)
    .then(r => r.json())
    .then(d => {
      const city = (d.results && d.results[0] && (d.results[0].name || d.results[0].admin1)) || '未知';
      fetchWeatherData(lat, lon, city);
    })
    .catch(() => fetchWeatherByIP());
}

function fetchWeatherByIP() {
  // 通过 IP 获取位置和天气
  fetch('https://ipapi.co/json/')
    .then(r => r.json())
    .then(d => {
      if (d.latitude && d.longitude) {
        const city = d.city || d.region || '未知';
        fetchWeatherData(d.latitude, d.longitude, city);
      } else {
        // 备用：使用默认城市
        fetchWeatherData(39.9042, 116.4074, '北京');
      }
    })
    .catch(() => {
      // 最终备用
      fetchWeatherData(39.9042, 116.4074, '北京');
    });
}

function fetchWeatherData(lat, lon, city) {
  // 使用 Open-Meteo 免费 API（无需 key，支持 CORS）
  fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&timezone=auto`)
    .then(r => r.json())
    .then(d => {
      if (d.current_weather) {
        const w = {
          temp: Math.round(d.current_weather.temperature),
          code: d.current_weather.weathercode,
          city: city,
          timestamp: Date.now()
        };
        localStorage.setItem('weatherCache', JSON.stringify(w));
        displayWeather(w);
      }
    })
    .catch(() => {
      // 显示缓存或默认
      const cachedW = localStorage.getItem('weatherCache');
      if (cachedW) {
        try { displayWeather(JSON.parse(cachedW)); return; } catch(e) {}
      }
      const iconEl = document.getElementById('weatherIcon');
      const tempEl = document.getElementById('weatherTemp');
      const cityEl = document.getElementById('weatherCity');
      if (iconEl) iconEl.textContent = '🌤️';
      if (tempEl) tempEl.textContent = '--°';
      if (cityEl) cityEl.textContent = city || '';
    });
}

function displayWeather(w) {
  const iconEl = document.getElementById('weatherIcon');
  const tempEl = document.getElementById('weatherTemp');
  const cityEl = document.getElementById('weatherCity');
  if (iconEl) iconEl.textContent = getWeatherIcon(w.code);
  if (tempEl) tempEl.textContent = w.temp + '°';
  if (cityEl) cityEl.textContent = w.city || '';
}

// 页面加载后获取天气
setTimeout(loadWeather, 500);
// 每30分钟刷新一次
setInterval(loadWeather, 30 * 60 * 1000);

// =============== 启动 ===============
renderSidebar();
renderPage();

</script>
